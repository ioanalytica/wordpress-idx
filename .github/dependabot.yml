version: 2
updates:
  # ── Runtime (weekly, majors reviewed individually) ──────────────

  # Node.js sidecar application (express, mysql2, flexsearch, …).
  # Minor/patch are grouped; majors get their own PR for review.
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      app-runtime-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Base image in the Dockerfile (the actual runtime).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # ── Dev / CI tooling (monthly, everything in one grouped PR) ─────
  # These have no runtime impact, so bundle every update — including
  # majors — into a single low-cadence PR instead of many.

  # Plugin JS/CSS linters (ESLint, Stylelint, Prettier).
  - package-ecosystem: "npm"
    directory: "/plugin/wordpress-idx-search"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      plugin-assets-tooling:
        patterns:
          - "*"

  # Plugin PHP dev tooling (PHPUnit, PHPCS/WPCS, polyfills).
  - package-ecosystem: "composer"
    directory: "/plugin/wordpress-idx-search"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      plugin-php-tooling:
        patterns:
          - "*"

  # GitHub Actions used across the CI workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
