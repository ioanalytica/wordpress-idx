name: Bug report
description: Something in the sidecar's search API or in the WordPress plugin does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A security issue goes to a [private report](https://github.com/ioanalytica/wordpress-idx/security/advisories/new) instead, and a problem with the Helm chart that deploys the sidecar to [wordpress-nginx](https://github.com/ioanalytica/wordpress-nginx/issues).
  - type: dropdown
    id: component
    attributes:
      label: Where is the problem?
      options:
        - Sidecar (search API, index)
        - WordPress plugin (search form, settings, updates)
        - Both / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: wordpress-idx version
      description: The tag of the sidecar image, or the plugin's version on the Plugins screen. Both, if they differ.
      placeholder: "1.3.7"
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: How does the sidecar run?
      options:
        - With the wordpress-nginx Helm chart
        - As a container, set up otherwise
        - From source (node)
        - Not sure
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: WordPress and PHP
      description: Their versions, for a problem in the plugin; the browser too, if the search form is affected.
      placeholder: "WordPress 6.8, PHP 8.2, Firefox 140"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: For the API, the request and what came back say the most.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The sidecar's log around the failure, with hosts, keys and passwords removed.
      render: text
