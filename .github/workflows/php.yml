name: Plugin (PHP)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  version-sync:
    name: Version SSOT check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Plugin version matches app/package.json
        run: bash scripts/sync-version.sh --check

  lint:
    name: PHPCS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin/wordpress-idx-search
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer
          coverage: none
      - name: Composer install
        run: composer install --no-interaction --prefer-dist
      - name: Run PHPCS
        run: composer lint

  test:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.2"]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: plugin/wordpress-idx-search
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          tools: composer
          coverage: none
      - name: Install WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 latest
      - name: Composer install
        run: composer install --no-interaction --prefer-dist
      - name: Run PHPUnit
        run: composer test
