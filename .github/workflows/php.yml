name: Plugin (PHP)

# A pull request runs every job once, whatever files it touches: the ruleset
# on main requires all four checks, and a workflow skipped by a path filter
# would leave them pending for good. Pushes run the jobs on main only; a push
# to a topic branch is covered by its pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job only reads the repository.
permissions:
  contents: read

jobs:
  version-sync:
    name: Version SSOT check
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes anything back, so the token has no business staying
          # behind in .git/config.
          persist-credentials: false
      - name: Plugin version matches app/package.json
        run: bash scripts/sync-version.sh --check

  lint:
    name: PHPCS
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugin/wordpress-idx-search
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.2"
          tools: composer
          coverage: none
      - name: Composer install
        run: composer install --no-interaction --prefer-dist
      - name: Run PHPCS
        run: composer lint

  test:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-26.04
    # Downloads WordPress and its test library before the tests start.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.2"]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: plugin/wordpress-idx-search
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          tools: composer
          coverage: none
      - name: Install WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 latest
      - name: Composer install
        run: composer install --no-interaction --prefer-dist
      - name: Run PHPUnit
        run: composer test
