name: Build and push Docker image

on:
  push:
    tags:
      - '*'
  workflow_dispatch:      # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # A release cut from a tree where the plugin version lags behind
      # app/package.json ships a manifest that advertises an update the package
      # does not contain, leaving WordPress in a permanent update loop.
      - name: Plugin version is in sync
        run: bash scripts/sync-version.sh --check

      - name: Tag matches the version in app/package.json
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(grep -m1 -E '"version"[[:space:]]*:' app/package.json \
            | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')"
          if [ "$tag" != "$version" ]; then
            echo "ERROR: tag '$tag' does not match app/package.json version '$version'." >&2
            exit 1
          fi
          echo "Tag and version agree: $tag"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag
        id: meta
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
