name: Image

# Builds the Dockerfile and publishes nothing: no registry login, no push.
# Released images of the sidecar are built, signed and published by the
# release of wordpress-nginx, which has this repository as a submodule and
# builds from this Dockerfile. A change that breaks the build should fail
# here, on its pull request, and not in a release over there.
#
# No path filter: the build reads the Dockerfile, .dockerignore, app/ and the
# plugin, which is most of the repository.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The job only reads the repository. The build cache (type=gha) uses the
# runner's own cache token, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  build:
    name: Dockerfile build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job pushes nothing back, so the token has no business staying
          # behind in .git/config.
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # One platform is enough to tell whether the Dockerfile builds; the
      # release builds linux/amd64 and linux/arm64, each on a runner of its
      # own architecture.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
