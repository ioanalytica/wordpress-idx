name: Tests

# A pull request runs every job once, whatever files it touches: the ruleset
# on main requires `test` and `test (with MySQL)`, and a workflow skipped by a
# path filter would leave them pending for good. Pushes run the jobs on main
# only; a push to a topic branch is covered by its pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job only reads the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    # A run takes about a minute; without a limit a hung job holds the run
    # for GitHub's default of six hours.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes anything back, so the token has no business staying
          # behind in .git/config.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # The suite above skips the database layer. This job provides a real MySQL so
  # the mysql2 integration tests actually run: the connection pool, the array
  # expansion in `IN (?)` that groups terms and comments, and DATETIME mapping.
  test-db:
    name: test (with MySQL)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_idx_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      IDX_TEST_DB: "1"
      IDX_TEST_DB_HOST: 127.0.0.1
      IDX_TEST_DB_PORT: "3306"
      IDX_TEST_DB_USER: root
      IDX_TEST_DB_PASS: root
      IDX_TEST_DB_NAME: wordpress_idx_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
